const bots={moxie:{name:'Moxie',main:0xff70ba,dark:0x5f36ad,accent:0xffe6f4, speed:7.6,jump:9.4,weight:1},byte:{name:'Byte',main:0x49e6d3,dark:0x176c98,accent:0xe4fffb,speed:9,jump:8.5,weight:.8},nova:{name:'Nova',main:0xffa54e,dark:0xd64758,accent:0xfff0cc,speed:7,jump:10.3,weight:1.15}};

function makeBot(key){const cfg=bots[key],root=new THREE.Group();scene.add(root);const body=new THREE.Group();root.add(body);const main=mat(cfg.main,.35,.3),dark=mat(cfg.dark,.48,.34),light=mat(cfg.accent,.3,.28),joint=mat(0x262746,.55,.3);const pelvis=new THREE.Group();pelvis.position.y=1.0;body.add(pelvis);

const arms=[],legs=[];for(const s of [-1,1]){const armPivot=new THREE.Group();armPivot.position.set(s*.47,.68,0);pelvis.add(armPivot);const upper=capsule(armPivot,.145,.38,main,[0,-.22,0]);upper.rotation.z=-s*.18;const elbow=sphere(armPivot,.16,joint,[0,-.47,0]);const lower=capsule(armPivot,.13,.32,dark,[s*.03,-.69,.02]);lower.rotation.z=s*.08;const hand=sphere(armPivot,.2,light,[s*.05,-.91,.05],[1,.82,.9]);arms.push(armPivot);

const gems=[];const gemMat=new THREE.MeshStandardMaterial({color:0xffec8b,emissive:0xe6a923,emissiveIntensity:1.4,metalness:.25,roughness:.2});for(let i=0;i<18;i++){const a=i*2.399;const r=2.2+(i%5)*1.43;const g=new THREE.Mesh(new THREE.OctahedronGeometry(.22,0),gemMat);g.position.set(Math.cos(a)*r,.78+(i%3)*.65,Math.sin(a)*r);g.castShadow=true;scene.add(g);const halo=new THREE.Mesh(new THREE.TorusGeometry(.3,.018,6,24),new THREE.MeshBasicMaterial({color:0xffe78a,transparent:true,opacity:.55}));halo.position.copy(g.position);halo.rotation.x=Math.PI/2;scene.add(halo);g.userData={base:g.position.clone(),halo,phase:i*1.7,active:true};gems.push(g)}
